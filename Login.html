<!DOCTYPE html>
<html lang="es">
<head>
    <title>ReciPET Kids - Login</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --recipet-accent: #d4ff00; }
        body { background-color: #fdfdf5; height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', sans-serif; }
        .card-login { background: #fff; border: none; border-radius: 30px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-login { background-color: var(--recipet-accent); color: #000; font-weight: bold; border-radius: 12px; padding: 12px; border: 1px solid #c0e600; width: 100%; transition: 0.3s; }
        .btn-login:hover { background-color: #c0e600; transform: scale(1.02); }
        .form-control { border-radius: 12px; border: 1px solid #eee; padding: 12px; }
        .logo-small { font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #1d1d1d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card-login text-center">
                    <a href="../index.html" class="logo-small mb-4 d-block">ReciPET<span class="text-success">KIDS</span></a>
                    <h4 class="fw-bold mb-4">¡Hola de nuevo!</h4>
                    
                    <div class="mb-3 text-start">
                        <label class="form-label small fw-bold">Usuario</label>
                        <input type="text" class="form-control" placeholder="Nombre de usuario">
                    </div>
                    <div class="mb-4 text-start">
                        <label class="form-label small fw-bold">Contraseña</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>

                    <button class="btn-login mb-3" onclick="location.href='Admin.html'">ENTRAR AL PANEL</button>
                    <a href="../index.html" class="text-muted small text-decoration-none">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
