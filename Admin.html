<!DOCTYPE html>
<html lang="es">
<head>
    <title>ReciPET Kids - Admin</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --recipet-accent: #d4ff00; }
        body { background-color: #fdfdf5; font-family: 'Segoe UI', sans-serif; }
        .navbar-admin { background: #fff; border-bottom: 1px solid #eee; padding: 15px 0; }
        .card-stat { background: #fff; border: none; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-bottom: 4px solid var(--recipet-accent); }
        .table-container { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .btn-action { background: var(--recipet-accent); border: none; border-radius: 8px; font-weight: bold; padding: 5px 15px; }
    </style>
</head>
<body>
    <nav class="navbar-admin mb-5">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="fw-bold fs-4">ReciPET<span class="text-success">KIDS</span> <span class="badge bg-light text-dark fw-normal ms-2" style="font-size: 0.7rem;">ADMIN</span></span>
            <a href="../index.html" class="btn btn-sm btn-outline-danger border-0 fw-bold">CERRAR SESIÓN</a>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card-stat">
                    <div class="text-muted small fw-bold">TOTAL PET RECOLECTADO</div>
                    <div class="display-6 fw-bold text-success">145.5 kg</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-stat">
                    <div class="text-muted small fw-bold">AHORRO AMBIENTAL ESTIMADO</div>
                    <div class="display-6 fw-bold">35%</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-stat">
                    <div class="text-muted small fw-bold">GRUPOS PARTICIPANTES</div>
                    <div class="display-6 fw-bold">06</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold m-0">Registro de Pesaje Semanal</h5>
                <button class="btn-action">+ Nuevo Registro</button>
            </div>
            <table class="table align-middle">
                <thead class="text-muted small">
                    <tr>
                        <th>FECHA</th>
                        <th>GRUPO</th>
                        <th>CANTIDAD</th>
                        <th>ESTADO</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>19 Feb, 2026</td>
                        <td class="fw-bold">Preescolar 3° A</td>
                        <td><span class="badge bg-success-subtle text-success">12.4 kg</span></td>
                        <td>Validado</td>
                    </tr>
                    <tr>
                        <td>18 Feb, 2026</td>
                        <td class="fw-bold">Preescolar 2° B</td>
                        <td><span class="badge bg-success-subtle text-success">8.9 kg</span></td>
                        <td>Validado</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
